name: publish

# Runs when a GitHub release is published. Needs a trusted publisher for
# magento1-client on PyPI (owner TinBane, repo python-magento, workflow
# publish.yml, environment pypi). 4.0.0 was uploaded by hand before that
# was set up.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
